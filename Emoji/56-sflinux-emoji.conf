<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias binding="strong">
        <family>emoji</family>
        <prefer>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>
    <alias>
        <family>sans-serif</family>
        <accept>
            <family>Apple Color Emoji</family>
        </accept>
    </alias>
    <alias>
        <family>serif</family>
        <accept>
            <family>Apple Color Emoji</family>
        </accept>
    </alias>
    <alias>
        <family>monospace</family>
        <accept>
            <family>Apple Color Emoji</family>
        </accept>
    </alias>
</fontconfig>
